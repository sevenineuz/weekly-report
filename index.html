<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#007AFF">
<title>Sevenine — Еженедельный отчёт</title>
</head>
<body>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --blue: #007AFF; --black: #000000; --gray1: #1C1C1E;
    --gray3: #636366; --gray4: #AEAEB2; --gray5: #E5E5EA; --gray6: #F2F2F7;
    --white: #FFFFFF; --radius: 12px; --radius-sm: 8px;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; background: var(--gray6); color: var(--gray1); padding: 24px 16px 40px; }
  .card { background: var(--white); border-radius: 20px; max-width: 600px; margin: 0 auto; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 8px 32px rgba(0,0,0,.06); }
  .header { padding: 24px 24px 18px; border-bottom: 0.5px solid var(--gray5); display: flex; align-items: center; justify-content: space-between; }
  .brand-line { display: flex; align-items: baseline; }
  .brand-black { font-size: 20px; font-weight: 600; color: var(--black); letter-spacing: -0.5px; }
  .brand-blue  { font-size: 20px; font-weight: 600; color: var(--blue); letter-spacing: -0.5px; }
  .brand-sub { font-size: 10px; color: var(--gray4); margin-top: 2px; letter-spacing: .03em; }
  .report-label { font-size: 10px; font-weight: 500; color: var(--blue); background: rgba(0,122,255,.08); padding: 4px 10px; border-radius: 20px; white-space: nowrap; }

  .lang-bar { padding: 11px 24px; border-bottom: 0.5px solid var(--gray5); display: flex; justify-content: flex-end; }
  .lang-seg { display: inline-flex; background: var(--gray6); border-radius: 10px; padding: 3px; gap: 2px; }
  .lang-btn { border: none; background: transparent; font-family: inherit; font-size: 11px; font-weight: 600; color: var(--gray3); padding: 5px 13px; border-radius: 8px; cursor: pointer; transition: all .15s; letter-spacing: .04em; }
  .lang-btn:hover { color: var(--blue); }
  .lang-btn.active { background: var(--white); color: var(--blue); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

  .section { padding: 18px 24px; border-bottom: 0.5px solid var(--gray5); }
  .section-label { font-size: 9px; font-weight: 700; color: var(--blue); letter-spacing: .09em; text-transform: uppercase; margin-bottom: 12px; }
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field-label { font-size: 10px; color: var(--gray4); font-weight: 500; }
  .field input, .field select, .week-selects input { font-size: 13px; color: var(--gray1); border: none; border-bottom: 1px solid var(--gray5); background: transparent; padding: 4px 0; outline: none; width: 100%; font-family: inherit; -webkit-appearance: none; }
  .field input:focus, .field select:focus, .week-selects input:focus { border-bottom-color: var(--blue); }
  .week-selects { display: flex; gap: 6px; align-items: center; }

  .prep-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .prep-hint { font-size: 10px; color: var(--gray3); margin-bottom: 8px; line-height: 1.4; }
  .prep-card { position: relative; border: 1px solid var(--gray5); border-radius: 10px; padding: 10px 6px; text-align: center; cursor: pointer; transition: all .18s; background: var(--white); user-select: none; opacity: .72; }
  .prep-card:hover { border-color: var(--blue); opacity: 1; }
  .prep-check { display: none; position: absolute; top: 5px; right: 5px; width: 17px; height: 17px; border-radius: 50%; color: #fff; font-size: 10px; font-weight: 700; line-height: 17px; }
  .prep-card.sel-1, .prep-card.sel-2, .prep-card.sel-3 { opacity: 1; }
  .prep-card.sel-1 .prep-check, .prep-card.sel-2 .prep-check, .prep-card.sel-3 .prep-check { display: block; }
  .prep-card.sel-1 .prep-check { background: #FF3B30; }
  .prep-card.sel-2 .prep-check { background: #FF9500; }
  .prep-card.sel-3 .prep-check { background: #34C759; }
  .prep-num { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .p1 .prep-num { color: #FF3B30; } .p2 .prep-num { color: #FF9500; } .p3 .prep-num { color: #34C759; }
  .prep-title { font-size: 10px; font-weight: 700; color: var(--gray1); margin-bottom: 4px; }
  .prep-desc { font-size: 8.5px; color: var(--gray3); line-height: 1.4; }
  .prep-card.sel-1 { background: rgba(255,59,48,.05); border-color: #FF3B30; }
  .prep-card.sel-2 { background: rgba(255,149,0,.05); border-color: #FF9500; }
  .prep-card.sel-3 { background: rgba(52,199,89,.05); border-color: #34C759; }

  /* star of the week */
  .star-toggle { width: 100%; display: flex; align-items: center; gap: 12px; border: 1px solid var(--gray5); border-radius: 12px; padding: 11px 14px; background: var(--white); cursor: pointer; font-family: inherit; text-align: left; transition: all .18s; }
  .star-toggle:hover { border-color: #FFB300; }
  .st-ico { width: 34px; height: 34px; border-radius: 50%; background: var(--gray6); color: var(--gray4); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; transition: all .18s; }
  .st-text { flex: 1; }
  .st-title { font-size: 12px; font-weight: 700; color: var(--gray1); }
  .st-sub { font-size: 9.5px; color: var(--gray3); line-height: 1.4; margin-top: 2px; }
  .st-check { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--gray5); flex-shrink: 0; color: #fff; font-size: 10px; font-weight: 700; line-height: 15px; text-align: center; transition: all .18s; }
  .star-toggle.on { border-color: #FFB300; background: rgba(255,179,0,.07); }
  .star-toggle.on .st-ico { background: linear-gradient(135deg,#FFC93C,#FF9F0A); color: #fff; }
  .star-toggle.on .st-check { background: #FF9F0A; border-color: #FF9F0A; }
  .star-toggle.on .st-check::after { content: '\2713'; }
  .star-reason { display: none; margin-top: 10px; }
  .star-reason.show { display: block; }
  .star-reason .sr-label { font-size: 10px; color: var(--gray3); font-weight: 600; margin-bottom: 5px; }
  .star-reason textarea { border-color: #FFD98A; background: #FFFBF0; }
  .star-reason textarea:focus { border-color: #FF9F0A; background: var(--white); }

  .tbl-head { display: grid; grid-template-columns: .85fr 110px 1.35fr; gap: 8px; margin-bottom: 4px; padding-bottom: 5px; border-bottom: 0.5px solid var(--gray5); }
  .tbl-head span { font-size: 9px; font-weight: 700; color: var(--gray4); letter-spacing: .04em; text-transform: uppercase; line-height: 1.3; }
  .skills-list { display: flex; flex-direction: column; }
  .skill-item { border-bottom: 0.5px solid var(--gray6); }
  .skill-item:last-child { border-bottom: none; }
  .skill-row { display: grid; grid-template-columns: .85fr 110px 1.35fr; align-items: start; gap: 8px; padding: 9px 0; }
  .skill-sugg { display: none; flex-wrap: wrap; gap: 5px; padding: 0 0 9px; }
  .skill-sugg.show { display: flex; }
  .sugg-below { padding: 10px 0 0; }
  .obs-themes { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 9px; }
  .obs-tab { border: 1px solid var(--gray5); background: var(--white); color: var(--gray3); font-family: inherit; font-size: 10.5px; font-weight: 600; padding: 5px 10px; border-radius: 14px; cursor: pointer; transition: all .15s; }
  .obs-tab:hover { border-color: var(--blue); color: var(--blue); }
  .obs-tab.on { background: var(--blue); border-color: var(--blue); color: #fff; }
  .sugg-chip { border: 1px solid var(--gray5); background: var(--gray6); color: var(--gray1); font-family: inherit; font-size: 10.5px; line-height: 1.35; text-align: left; padding: 5px 9px; border-radius: 14px; cursor: pointer; transition: all .15s; }
  .sugg-chip:hover { border-color: var(--blue); color: var(--blue); background: rgba(0,122,255,.06); }
  .sugg-chip.added { border-color: var(--blue); background: rgba(0,122,255,.10); color: var(--blue); }
  .sugg-chip.added::before { content: '✓ '; font-weight: 700; }
  .skill-label-line1 { font-size: 12px; font-weight: 600; color: var(--gray1); }
  .stars { display: flex; gap: 2px; }
  .star { font-size: 17px; cursor: pointer; color: var(--gray5); transition: color .12s, transform .1s; user-select: none; line-height: 1; }
  .star.on { color: var(--blue); }
  .star:hover { transform: scale(1.2); }
  .skill-comment { font-size: 11px; line-height: 1.4; border: none; border-bottom: 1px solid var(--gray5); background: transparent; outline: none; width: 100%; color: var(--gray1); font-family: inherit; padding: 2px 0; resize: none; display: block; }
  .skill-comment:focus { border-bottom-color: var(--blue); }
  .field-textarea { width: 100%; border: 1px solid var(--gray5); border-radius: var(--radius-sm); padding: 9px 11px; font-size: 12px; font-family: inherit; color: var(--gray1); background: var(--gray6); resize: none; outline: none; line-height: 1.55; }
  .field-textarea:focus { border-color: var(--blue); background: var(--white); }
  .actions { padding: 18px 24px 22px; }
  .btn-save { width: 100%; padding: 13px; background: var(--blue); color: var(--white); border: none; border-radius: var(--radius); font-size: 14px; font-weight: 500; font-family: inherit; cursor: pointer; transition: opacity .15s; }
  .btn-save:hover { opacity: .88; } .btn-save:disabled { opacity: .45; cursor: not-allowed; }
  .status { font-size: 11px; color: var(--gray4); text-align: center; margin-top: 8px; min-height: 16px; }


  /* Result sheet. A page cannot write to the photo gallery; the system share
     sheet can. iOS only opens it from its own tap, and rendering the PNG is
     async, so the finished image waits here for a second, deliberate tap. */
  .sheet { display: none; position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.45); align-items: flex-end; justify-content: center; padding: 16px; }
  .sheet.show { display: flex; }
  .sheet-card { background: var(--white); border-radius: 18px; width: 100%; max-width: 420px; padding: 18px 18px 8px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
  .sheet-title { font-size: 15px; font-weight: 700; color: var(--gray1); margin-bottom: 12px; }
  .sh-preview { width: 100%; max-height: 40vh; object-fit: contain; border-radius: 10px; border: 1px solid var(--gray5); background: var(--gray6); display: block; }
  .sh-hint { font-size: 10.5px; color: var(--gray3); line-height: 1.45; margin: 10px 2px 12px; }
  .sh-btn { width: 100%; padding: 14px; border: none; border-radius: var(--radius); font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; }
  .sh-primary { background: var(--blue); color: #fff; }
  .sh-secondary { background: var(--gray6); color: var(--blue); margin-top: 8px; }
  .sh-status { font-size: 11.5px; color: var(--gray3); min-height: 16px; margin-top: 8px; }
  .sh-close { background: none; border: none; color: var(--gray3); font-family: inherit; font-size: 13px; padding: 13px; cursor: pointer; width: 100%; }

  /* snapshot */
  #snapshot { position: fixed; left: -9999px; top: 0; width: 540px; height: 960px; background: white; font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; overflow: hidden; }
  .sn { width: 100%; height: 100%; display: flex; flex-direction: column; padding: 28px 28px 20px; position: relative; overflow: hidden; }
  .sn-stamp { display: none; position: absolute; right: 6px; bottom: 34px; z-index: 0; transform: rotate(-16deg); }
  .sn.stamped .sn-stamp { display: block; }
  .sn-stamp .st-seal { display: block; width: 268px; height: 268px; }
  .sn-hdr, .sn-star, .sn-sec, .sn-footer { position: relative; z-index: 1; }
  .sn.stamped .sn-box { background: rgba(242,242,247,.72); }
  .sn-hdr { display: flex; align-items: flex-start; justify-content: space-between; padding-bottom: 14px; border-bottom: 1.5px solid #E5E5EA; margin-bottom: 16px; flex-shrink: 0; }
  .sn-brand { font-size: 26px; font-weight: 700; letter-spacing: -.5px; line-height: 1; }
  .sn-brand .nb { color: #000; } .sn-brand .bl { color: #007AFF; }
  .sn-sub { font-size: 10px; color: #AEAEB2; margin-top: 4px; letter-spacing: .06em; }
  .sn-badge { font-size: 11px; font-weight: 600; color: #007AFF; background: #EAF3FF; padding: 5px 12px; border-radius: 20px; }
  .sn-sec { margin-bottom: 14px; flex-shrink: 0; }
  .sn-star { display: none; flex-direction: column; padding: 11px 14px 12px; margin-bottom: 14px; border-radius: 12px; border: 1.5px solid #FFB300; background: #FFF6E0; flex-shrink: 0; }
  .sn-star.show { display: flex; }
  .sn-star .ss-top { display: flex; align-items: center; gap: 12px; }
  .sn-star .ss-ico { width: 38px; height: 38px; border-radius: 50%; background: #FF9F0A; color: #fff; font-size: 20px; line-height: 38px; text-align: center; flex-shrink: 0; }
  .sn-star .ss-t { font-size: 14px; font-weight: 800; color: #7A4E00; letter-spacing: .06em; text-transform: uppercase; }
  .sn-star .ss-s { font-size: 9.5px; color: #9A6A00; margin-top: 3px; line-height: 1.45; }
  .sn-star .ss-reason { display: none; margin-top: 9px; padding: 7px 10px; border-left: 3px solid #FF9F0A; border-radius: 0 6px 6px 0; background: rgba(255,255,255,.8); font-size: 10.5px; line-height: 1.5; color: #5C3B00; }
  .sn-star .ss-reason.show { display: block; }
  .sn-star .ss-rl { font-size: 8px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #C08400; margin-bottom: 3px; }
  .sn-lbl { font-size: 9px; font-weight: 700; color: #007AFF; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 0.5px solid #E5E5EA; }
  .sn-info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; }
  .sn-fl { font-size: 9px; color: #AEAEB2; font-weight: 500; margin-bottom: 2px; }
  .sn-fv { font-size: 13px; font-weight: 700; color: #1C1C1E; padding-bottom: 4px; border-bottom: 0.75px solid #E5E5EA; min-height: 20px; }
  .sn-result { border-radius: 12px; padding: 14px 16px; border: 2px solid #E5E5EA; display: flex; gap: 14px; align-items: flex-start; }
  .sn-result.r1 { background: rgba(255,59,48,.08);  border-color: #FF3B30; }
  .sn-result.r2 { background: rgba(255,149,0,.08);  border-color: #FF9500; }
  .sn-result.r3 { background: rgba(52,199,89,.08);  border-color: #34C759; }
  .sn-rbadge { flex-shrink: 0; width: 50px; height: 50px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; }
  .sn-result.r1 .sn-rbadge { background: #FF3B30; }
  .sn-result.r2 .sn-rbadge { background: #FF9500; }
  .sn-result.r3 .sn-rbadge { background: #34C759; }
  .sn-rbadge .rn  { font-size: 24px; font-weight: 800; line-height: 1; }
  .sn-rbadge .rof { font-size: 8px; opacity: .9; margin-top: 1px; letter-spacing: .03em; }
  .sn-rbody { flex: 1; }
  .sn-rtitle { font-size: 14px; font-weight: 800; color: #1C1C1E; margin-bottom: 4px; }
  .sn-rdesc { font-size: 9.5px; color: #3A3A3C; line-height: 1.45; }
  .sn-rnone { font-size: 13px; color: #AEAEB2; padding: 6px 0; }
  .sn-skills-hd { display: grid; grid-template-columns: .72fr 88px 1.48fr; gap: 8px; padding-bottom: 4px; border-bottom: 0.5px solid #E5E5EA; margin-bottom: 2px; }
  .sn-skills-hd span { font-size: 8px; font-weight: 700; color: #AEAEB2; text-transform: uppercase; letter-spacing: .04em; line-height: 1.35; }
  .sn-sr { display: grid; grid-template-columns: .72fr 88px 1.48fr; gap: 8px; align-items: start; padding: 6px 0; border-bottom: 0.5px solid #F2F2F7; }
  .sn-sr:last-child { border-bottom: none; }
  .sn-sk-name { font-size: 12px; font-weight: 600; color: #1C1C1E; }
  .sn-stars { font-size: 15px; letter-spacing: 1px; }
  .sn-cmt { font-size: 10px; line-height: 1.35; color: #636366; border-bottom: 0.5px solid #E5E5EA; min-height: 16px; padding-bottom: 2px; }
  .sn-norate { font-size: 9.5px; color: #AEAEB2; letter-spacing: .01em; }
  /* no skill comments written: drop the column and give the width back to the names */
  .sn.no-cmt .sn-skills-hd, .sn.no-cmt .sn-sr { grid-template-columns: 190px 1fr; }
  .sn.no-cmt .sn-cmt, .sn.no-cmt #sn-th3 { display: none; }
  .sn-box { background: #F2F2F7; border-radius: 8px; padding: 9px 12px; font-size: 11.5px; color: #1C1C1E; line-height: 1.55; white-space: pre-wrap; min-height: 38px; }
  .sn-footer { margin-top: auto; padding-top: 10px; border-top: 0.5px solid #E5E5EA; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
  .sn-ft-school { font-size: 9px; color: #AEAEB2; }
  .sn-ft-ig { font-size: 9px; font-weight: 600; color: #007AFF; }
</style>

<div class="card">
  <div class="header">
    <div>
      <div class="brand-line"><span class="brand-black">Seve</span><span class="brand-blue">n</span><span class="brand-black">ine</span></div>
      <div class="brand-sub">ENGLISH SCHOOL · TASHKENT</div>
    </div>
    <div class="report-label" data-i18n="reportLabel"></div>
  </div>

  <div class="lang-bar">
    <div class="lang-seg">
      <button class="lang-btn" data-lang="ru" onclick="applyLang('ru')">RUS</button>
      <button class="lang-btn" data-lang="uz" onclick="applyLang('uz')">UZB</button>
      <button class="lang-btn" data-lang="en" onclick="applyLang('en')">ENG</button>
    </div>
  </div>

  <div class="section">
    <div class="section-label" data-i18n="about"></div>
    <div class="info-grid">
      <div class="field"><div class="field-label" data-i18n="nameLabel"></div><input id="f-name" type="text" data-i18n-ph="namePh"></div>
      <div class="field"><div class="field-label" data-i18n="groupLabel"></div>
        <select id="f-group" onchange="refreshSuggestions()"><option value="">—</option><optgroup label="Kids"><option>Kids — Level 1</option><option>Kids — Level 2</option><option>Kids — Level 3</option><option>Kids — Level 4</option></optgroup><optgroup label="Adults"><option>A1 — Beginner</option><option>A2 — Elementary</option><option>B1 — Pre-Intermediate</option><option>B1+ — Intermediate</option><option>B2 — Upper-Intermediate</option><option>C1 — IELTS</option></optgroup></select>
      </div>
      <div class="field"><div class="field-label" data-i18n="teacherLabel"></div><input id="f-teacher" type="text" data-i18n-ph="teacherPh"></div>
      <div class="field"><div class="field-label" data-i18n="periodLabel"></div>
        <div class="week-selects">
          <input id="f-week" type="week" data-i18n-title="weekTitle">
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-label" data-i18n="grade"></div>
    <div class="prep-hint" data-i18n="prepHint"></div>
    <div class="prep-grid" id="prepGrid"></div>
  </div>

  <div class="section">
    <div class="section-label" data-i18n="award"></div>
    <button type="button" class="star-toggle" id="starToggle" onclick="toggleStar()">
      <div class="st-ico">★</div>
      <div class="st-text">
        <div class="st-title" data-i18n="starTitle"></div>
        <div class="st-sub" data-i18n="starHint"></div>
      </div>
      <div class="st-check"></div>
    </button>
    <div class="star-reason" id="starReason">
      <div class="sr-label" data-i18n="reasonLabel"></div>
      <textarea id="f-star-why" class="field-textarea" rows="2" data-i18n-ph="reasonPh"></textarea>
    </div>
  </div>

  <div class="section">
    <div class="section-label" data-i18n="skills"></div>
    <div class="tbl-head">
      <span data-i18n="thSkill"></span>
      <span data-i18n="thScore"></span>
      <span data-i18n="thComment"></span>
    </div>
    <div class="skills-list" id="skillsList"></div>
  </div>

  <div class="section">
    <div class="section-label" data-i18n="observation"></div>
    <div class="prep-hint" data-i18n="obsHint"></div>
    <div class="obs-themes" id="obsThemes"></div>
    <textarea id="f-obs" class="field-textarea" rows="3" data-i18n-ph="obsPh" onfocus="suggestObsOnFocus()"></textarea>
    <div class="skill-sugg sugg-below" id="sugg-obs"></div>
  </div>

  <div class="section">
    <div class="section-label" data-i18n="tip"></div>
    <div class="prep-hint" data-i18n="tipHint"></div>
    <div class="obs-themes" id="tipThemes"></div>
    <textarea id="f-tip" class="field-textarea" rows="2" data-i18n-ph="tipPh" onfocus="suggestTipOnFocus()"></textarea>
    <div class="skill-sugg sugg-below" id="sugg-tip"></div>
  </div>

  <div class="actions">
    <button class="btn-save" id="saveBtn" onclick="saveImage()" data-i18n="saveBtn"></button>
    <div class="status" id="status"></div>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="sheet-card">
    <div class="sheet-title" data-i18n="sheetTitle"></div>
    <img class="sh-preview" id="shPreview" alt="">
    <div class="sh-hint" data-i18n="shareHint"></div>
    <button type="button" class="sh-btn sh-primary"   data-i18n="shareBtn" onclick="shareNow()"></button>
    <button type="button" class="sh-btn sh-secondary" data-i18n="dlBtn"    onclick="downloadFromSheet()"></button>
    <div class="sh-status" id="shStatus"></div>
    <button type="button" class="sh-close" data-i18n="closeBtn" onclick="closeSheet()"></button>
  </div>
</div>

<div id="snapshot">
  <div class="sn" id="sn-root">

function buildSkills() {

    const item = document.createElement('div');
    item.className = 'skill-item';
    item.innerHTML = `
      <div class="skill-row">
        <div><div class="skill-label-line1" id="skname-${i}">${s[lang]}</div></div>
        <div class="stars" id="stars-${i}">${[1,2,3,4,5].map(v=>`<span class="star" onclick="setStar(${i},${v})">★</span>`).join('')}</div>
        <textarea class="skill-comment" id="cmt-${i}" rows="2" placeholder="—"></textarea>
      </div>
    `;
    list.appendChild(item);
  });
}

function relabelSkills() {
  SKILLS.forEach((s, i) => {
    const el = document.getElementById('skname-' + i);
    if (el) el.textContent = s[lang];
  });
}

function buildPrep() {
  const grid = document.getElementById('prepGrid');
  grid.innerHTML = PREP_DATA.map(p => `
    <div class="prep-card p${p.num}" data-lv="${p.num}" onclick="selectPrep(${p.num})">
      <div class="prep-check">✓</div>
      <div class="prep-num">${p.num}</div>
      <div class="prep-title">${p.title[lang]}</div>
      <div class="prep-desc">${p.desc[lang]}</div>
    </div>`).join('');
  if (prepLevel >= 1 && prepLevel <= 3) {
    const c = grid.querySelector(`.prep-card[data-lv="${prepLevel}"]`);
    if (c) c.classList.add('sel-' + prepLevel);
  }
}

function setStar(idx, v) {
  ratings[idx] = v;
  document.querySelectorAll(`#stars-${idx} .star`).forEach((s,i) => s.classList.toggle('on', i < v));
  refreshSuggestions();
}

// Kids 1-4 / A1-A2 / B1-C1 get different phrasing for the same star rating.
// With no group picked yet, the A1-A2 set reads acceptably for either audience.
function levelBand() {
  const g = document.getElementById('f-group').value;
  if (!g) return 'beg';
  if (g.startsWith('Kids')) return /Level [12]$/.test(g) ? 'kids1' : 'kids2';
  if (g.startsWith('A1') || g.startsWith('A2')) return 'beg';
  return 'adv';
}

function refreshSuggestions() {
  if (document.getElementById('sugg-obs')?.classList.contains('show')) showObsSuggestions();
  if (document.getElementById('sugg-tip')?.classList.contains('show')) showTipSuggestions();
}

// Reads the pattern of stars rather than one skill: how the week went overall,
// and which skill came out strongest / weakest. Null until something is rated.
function ratingStats() {
  const rated = SKILLS.map((_, i) => ({ i, v: ratings[i] || 0 })).filter(x => x.v > 0);
  if (!rated.length) return null;
  const vals = rated.map(x => x.v);
  const max = Math.max(...vals), min = Math.min(...vals);
  return {
    avg: vals.reduce((a, b) => a + b, 0) / vals.length,
    strong: rated.find(x => x.v === max).i,
    weak:   rated.find(x => x.v === min).i,
    flat: max === min,   // one skill rated, or all rated the same: no spread to name
    min, max,
  };
}

let obsList = [], tipList = [];

function renderChips(boxId, list, fn, fieldId) {
  const box = document.getElementById(boxId);
  const cur = fieldId ? document.getElementById(fieldId).value : '';
  box.innerHTML = list.map((ph, k) =>
    `<button type="button" class="sugg-chip${cur.includes(ph) ? ' added' : ''}" onclick="${fn}(${k})">${ph}</button>`).join('');
  box.classList.toggle('show', list.length > 0);
}

// Chips add to what is already in the box rather than replacing it; tapping an
// added chip takes that sentence back out. The panel stays open either way.
function toggleIntoField(fieldId, text) {
  const el = document.getElementById(fieldId);
  let v = el.value;
  if (v.includes(text)) {
    v = v.replace(text, '');
  } else {
    const base = v.replace(/[\s.]+$/, '');
    v = base ? base + '. ' + text : text;
  }
  el.value = el.title = v.replace(/\s*\.\s*\./g, '.').replace(/\s{2,}/g, ' ').replace(/^[\s.]+/, '').trim();
}

// Teachers write about one of a few recurring things, not only about level.
// 'progress' is inferred from the stars; the rest are picked by hand.
const OBS_TABS = ['progress', 'homework', 'behaviour', 'vocabulary', 'motivation'];
let obsTheme = 'progress';

function buildObsTabs() {
  const t = T[lang], box = document.getElementById('obsThemes');
  if (!box) return;
  const label = { progress: t.thProgress, homework: t.thHomework, behaviour: t.thBehaviour,
                  vocabulary: t.thVocabulary, motivation: t.thMotivation };
  box.innerHTML = OBS_TABS.map(k =>
    `<button type="button" class="obs-tab${k === obsTheme ? ' on' : ''}" onclick="setObsTheme('${k}')">${label[k]}</button>`).join('');
}

function setObsTheme(k) {
  obsTheme = k;
  buildObsTabs();
  showObsSuggestions();
}

function showObsSuggestions() {
  const band = levelBand();
  if (obsTheme !== 'progress') {
    const th = OBS_THEMES[band]?.[lang]?.[obsTheme];
    obsList = th ? th.good.concat(th.bad) : [];
    return renderChips('sugg-obs', obsList, 'useObs', 'f-obs');
  }
  const st = ratingStats();
  if (!st) { obsList = []; return renderChips('sugg-obs', [], 'useObs', 'f-obs'); }
  const cat = st.avg >= 4.5 ? 'high' : st.avg >= 3.5 ? 'good' : st.avg >= 2.5 ? 'mid' : 'low';
  obsList = st.flat
    ? OBS_FLAT[band][lang][cat]
    : OBS_TPL[band][lang][cat].map(t => t
        .replace('{strong}', SKILLS[st.strong][lang].toLowerCase())
        .replace('{weak}',   SKILLS[st.weak][lang].toLowerCase()));
  renderChips('sugg-obs', obsList, 'useObs', 'f-obs');
}

const TIP_TABS = ['skill', 'homework', 'vocabulary', 'support'];
let tipTheme = 'skill';

function buildTipTabs() {
  const t = T[lang], box = document.getElementById('tipThemes');
  if (!box) return;
  const label = { skill: t.tpSkill, homework: t.tpHomework, vocabulary: t.tpVocabulary, support: t.tpSupport };
  box.innerHTML = TIP_TABS.map(k =>
    `<button type="button" class="obs-tab${k === tipTheme ? ' on' : ''}" onclick="setTipTheme('${k}')">${label[k]}</button>`).join('');
}

function setTipTheme(k) {
  tipTheme = k;
  buildTipTabs();
  showTipSuggestions();
}

function showTipSuggestions() {
  const band = levelBand();
  if (tipTheme !== 'skill') {
    tipList = TIP_THEMES[band]?.[tipTheme]?.[lang] || [];
    return renderChips('sugg-tip', tipList, 'useTip', 'f-tip');
  }
  const st = ratingStats();
  if (!st) { tipList = []; return renderChips('sugg-tip', [], 'useTip', 'f-tip'); }
  tipList = st.min >= 5 ? TIPS_TOP[band][lang]
          : st.flat      ? [0, 2, 5].map(i => TIPS[band][i][lang][0])   // speaking / reading / vocabulary
          :                TIPS[band][st.weak][lang];
  renderChips('sugg-tip', tipList, 'useTip', 'f-tip');
}

function useObs(k) { toggleIntoField('f-obs', obsList[k]); showObsSuggestions(); }
function useTip(k) { toggleIntoField('f-tip', tipList[k]); showTipSuggestions(); }
function suggestObsOnFocus() { if (!document.getElementById('f-obs').value.trim()) showObsSuggestions(); }

function suggestTipOnFocus() { if (!document.getElementById('f-tip').value.trim()) showTipSuggestions(); }


function selectPrep(lv) {
  prepLevel = lv;
  document.querySelectorAll('.prep-card').forEach(c => c.classList.remove('sel-1','sel-2','sel-3'));
  const c = document.querySelector(`.prep-card[data-lv="${lv}"]`);
  if (c) c.classList.add(`sel-${lv}`);
}

function toggleStar() {
  starOfWeek = !starOfWeek;
  document.getElementById('starToggle').classList.toggle('on', starOfWeek);
  document.getElementById('starReason').classList.toggle('show', starOfWeek);
  if (starOfWeek) document.getElementById('f-star-why').focus();
}

function applyLang(l) {
  lang = l;
  const t = T[l];
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === l));
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t[el.getAttribute('data-i18n')]; });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t[el.getAttribute('data-i18n-ph')]; });
  document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t[el.getAttribute('data-i18n-title')]; });
  const sel = document.getElementById('f-group');
  sel.options[0].text = t.groupPlaceholder;
  const ogs = sel.querySelectorAll('optgroup');
  if (ogs[0]) ogs[0].label = t.kids;
  if (ogs[1]) ogs[1].label = t.adults;
  document.querySelectorAll('textarea, input[type="text"]').forEach(el => {
    el.lang = l;              // picks the browser's dictionary for this language
    el.spellcheck = true;
  });
  relabelSkills();
  buildPrep();
  buildObsTabs();
  buildTipTabs();
}

const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };

// Convert an ISO week value ("2026-W20") into its Monday–Sunday calendar dates
function isoWeekToRange(v) {
  const m = /^(\d{4})-W(\d{2})$/.exec(v || '');
  if (!m) return null;
  const year = +m[1], week = +m[2];
  const jan4 = new Date(Date.UTC(year, 0, 4));
  const jan4Day = jan4.getUTCDay() || 7;            // Mon=1 … Sun=7
  const monday = new Date(jan4);
  monday.setUTCDate(jan4.getUTCDate() - (jan4Day - 1) + (week - 1) * 7);
  const sunday = new Date(monday);
  sunday.setUTCDate(monday.getUTCDate() + 6);
  const part = dt => ({ y: dt.getUTCFullYear(), m: dt.getUTCMonth(), d: dt.getUTCDate() });
  return { s: part(monday), e: part(sunday) };
}

// Short date range in the active language, e.g. "11–17 мая" or "29 июн – 1 июл"
function fmtRange(s, e) {
  const mon = T[lang].months;
  if (s.m === e.m && s.y === e.y) return `${s.d}–${e.d} ${mon[s.m]}`;
  return `${s.d} ${mon[s.m]} – ${e.d} ${mon[e.m]}`;
}

const getPeriod = () => {
  const r = isoWeekToRange(val('f-week'));
  return r ? fmtRange(r.s, r.e) : T[lang].dash;
};

function buildFilename() {
  const name = val('f-name').trim() || 'student';
  const r = isoWeekToRange(val('f-week'));
  const pad = n => String(n).padStart(2, '0');
  const range = r ? `${pad(r.s.d)}.${pad(r.s.m + 1)}-${pad(r.e.d)}.${pad(r.e.m + 1)}` : '';
  const star = starOfWeek ? 'star' : '';
  return [name, range, star].filter(Boolean).join('_').replace(/\s+/g, '_');
}

function buildSnapshot() {
  const t = T[lang];
  const dash = t.dash;

  // localized snapshot labels
  document.getElementById('sn-badge').textContent     = t.reportLabel;
  document.getElementById('sn-lbl-about').textContent  = t.about;
  document.getElementById('sn-lbl-grade').textContent  = t.grade;
  document.getElementById('sn-lbl-skills').textContent = t.skills;
  document.getElementById('sn-lbl-obs').textContent    = t.observation;
  document.getElementById('sn-lbl-tip').textContent    = t.tip;
  document.getElementById('sn-fl-name').textContent    = t.nameLabel;
  document.getElementById('sn-fl-group').textContent   = t.groupLabel;
  document.getElementById('sn-fl-teacher').textContent = t.teacherLabel;
  document.getElementById('sn-fl-period').textContent  = t.periodLabel;
  document.getElementById('sn-th1').textContent = t.thSkill;
  document.getElementById('sn-th2').textContent = t.thScore;
  document.getElementById('sn-th3').textContent = t.thComment;

  // values
  document.getElementById('sn-name').textContent    = val('f-name')    || dash;
  document.getElementById('sn-group').textContent   = val('f-group')   || dash;
  document.getElementById('sn-teacher').textContent = val('f-teacher') || dash;
  document.getElementById('sn-period').textContent  = getPeriod();
  document.getElementById('sn-obs').textContent     = val('f-obs')     || dash;
  document.getElementById('sn-tip').textContent     = val('f-tip')     || dash;

  const root = document.getElementById('sn-root');
  document.getElementById('sn-star').classList.toggle('show', starOfWeek);
  root.classList.toggle('stamped', starOfWeek);
  document.getElementById('sn-star-title').textContent = t.starBanner;
  document.getElementById('sn-star-sub').textContent   = t.starBannerSub;
  const why = val('f-star-why');
  document.getElementById('sn-star-reason').classList.toggle('show', starOfWeek && !!why);
  document.getElementById('sn-star-rl').textContent  = t.reasonTitle;
  document.getElementById('sn-star-why').textContent = why;

  const prepEl = document.getElementById('sn-prep');
  if (prepLevel >= 1 && prepLevel <= 3) {
    const p = PREP_DATA[prepLevel - 1];
    prepEl.innerHTML = `
      <div class="sn-result r${prepLevel}">
        <div class="sn-rbadge"><span class="rn">${p.num}</span><span class="rof">${t.of3}</span></div>
        <div class="sn-rbody">
          <div class="sn-rtitle">${p.title[lang]}</div>
          <div class="sn-rdesc">${p.desc[lang]}</div>
        </div>
      </div>`;
  } else {
    prepEl.innerHTML = `<div class="sn-rnone">${t.noGrade}</div>`;
  }

  // A skill nobody rated must not read as a skill rated zero.
  const anyComment = SKILLS.some((_, i) => document.getElementById(`cmt-${i}`)?.value.trim());
  root.classList.toggle('no-cmt', !anyComment);

  document.getElementById('sn-skills').innerHTML = SKILLS.map((s, i) => {
    const score = ratings[i]
      ? [1,2,3,4,5].map(v => `<span style="color:${v <= ratings[i] ? '#007AFF' : '#E5E5EA'}">★</span>`).join('')
      : `<span class="sn-norate">${t.notRated}</span>`;
    const cmt = document.getElementById(`cmt-${i}`)?.value.trim() || dash;
    return `
      <div class="sn-sr">
        <div><div class="sn-sk-name">${s[lang]}</div></div>
        <div class="sn-stars">${score}</div>
        <div class="sn-cmt">${cmt}</div>
      </div>`;
  }).join('');

  fitSnapshot();
}

// Snapshot is a fixed 540x960 canvas: tighten the gaps between sections until
// the content fits, so a long award reason or observation never gets clipped.
// Measured off the footer (not scrollHeight, which also counts the rotated stamp).
function fitSnapshot() {
  const root = document.getElementById('sn-root');
  const foot = root.querySelector('.sn-footer');
  const gaps = root.querySelectorAll('.sn-star, .sn-sec');
  const rows = root.querySelectorAll('.sn-sr');
  const overflows = () =>
    foot.getBoundingClientRect().bottom > root.getBoundingClientRect().bottom - 20;
  for (let m = 14; m >= 6; m--) {
    gaps.forEach(el => el.style.marginBottom = m + 'px');
    if (!overflows()) return;
  }
  // Gaps alone were not enough (long diagnostic comments): tighten the skill rows too.
  for (let pad = 6; pad >= 2; pad--) {
    rows.forEach(el => { el.style.paddingTop = el.style.paddingBottom = pad + 'px'; });
    if (!overflows()) return;
  }
}

// The finished report, kept as Files so the share sheet can take one on the next tap.
// PNG for the camera roll; PDF for sending, because Telegram re-encodes anything it
// recognises as a photo (losing the filename and softening the small text) but passes
// a PDF through untouched, as a document.
let lastFile = null, lastUrl = null;      // PNG
let lastPdfFile = null, lastPdfUrl = null;

function downloadBlobUrl(name, url) {
  const link = document.createElement('a');
  link.download = name;
  link.href = url;
  link.click();
}

async function saveImage() {
  const btn = document.getElementById('saveBtn');
  const status = document.getElementById('status');
  const t = T[lang];
  btn.disabled = true; btn.textContent = t.saving; status.textContent = '';
  try {
    buildSnapshot();
    await new Promise(r => setTimeout(r, 100));
    const canvas = await html2canvas(document.getElementById('snapshot'), {
      scale: 3, useCORS: true, backgroundColor: '#ffffff', width: 540, height: 960, windowWidth: 540,
    });
    const base = buildFilename();
    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
    if (lastUrl) URL.revokeObjectURL(lastUrl);
    lastUrl = URL.createObjectURL(blob);
    lastFile = new File([blob], base + '.png', { type: 'image/png' });

    // Same pixels, wrapped in a PDF page of exactly the snapshot's proportions.
    // Flate-compressed, so nothing is re-encoded and the text stays as rendered.
    const pdf = new jspdf.jsPDF({ unit: 'px', format: [540, 960], orientation: 'portrait',
                                  compress: true, hotfixes: ['px_scaling'] });
    pdf.addImage(canvas, 'PNG', 0, 0, 540, 960, undefined, 'FAST');
    const pdfBlob = pdf.output('blob');
    if (lastPdfUrl) URL.revokeObjectURL(lastPdfUrl);
    lastPdfUrl = URL.createObjectURL(pdfBlob);
    lastPdfFile = new File([pdfBlob], base + '.pdf', { type: 'application/pdf' });

    // A web page cannot write to Photos, but the system share sheet can: on iOS it
    // offers "Save Image", on Android "Save to gallery". iOS only opens that sheet
    // from a tap of its own, and the render above is async, so the report waits in
    // our own sheet for a second tap instead of going straight to Files.
    const touch = window.matchMedia('(pointer: coarse)').matches;
    if (touch && navigator.canShare && navigator.canShare({ files: [lastPdfFile] })) {
      openSheet();
      btn.textContent = T[lang].saveBtn; btn.disabled = false;
      return;
    }

    // Desktop: no share sheet worth using, so download as before.
    downloadBlobUrl(lastFile.name, lastUrl);
    btn.textContent = t.saved; btn.style.background = '#34C759';
    setTimeout(() => { btn.textContent = T[lang].saveBtn; btn.style.background = ''; btn.disabled = false; }, 2500);
  } catch(e) {
    status.textContent = t.errPrefix + e.message;
    btn.textContent = T[lang].saveBtn; btn.disabled = false;
  }
}

function openSheet() {
  document.getElementById('shPreview').src = lastUrl;
  document.getElementById('shStatus').textContent = '';
  document.getElementById('sheet').classList.add('show');
}

function closeSheet() {
  document.getElementById('sheet').classList.remove('show');
}

// Fires from its own tap, so iOS accepts it. Only the file is shared: adding
// title/text makes some targets drop the image and share the text instead.
async function shareNow() {
  const t = T[lang], st = document.getElementById('shStatus');
  if (!lastPdfFile) return;
  try {
    await navigator.share({ files: [lastPdfFile] });
    st.textContent = t.shareDone;
  } catch(e) {
    if (e.name === 'AbortError') return;   // teacher dismissed the share sheet
    st.textContent = t.shareFail;
  }
}

function downloadFromSheet() {
  if (lastFile) downloadBlobUrl(lastFile.name, lastUrl);
}

// init
buildSkills();
applyLang('ru');
</script>
